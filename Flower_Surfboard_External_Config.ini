[custom]
# Public external configuration. It contains no subscription URL or credentials.
surfboard_rule_base=https://raw.githubusercontent.com/qjunhuide/surfboard-flower-config/main/Flower_Surfboard_Base_Overlay.conf
enable_rule_generator=false
overwrite_original_rules=false

